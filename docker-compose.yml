services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env (use mongodb://mongodb:27017/jobportal for Compose)}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:?Set ADZUNA_APP_ID in .env}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:?Set ADZUNA_APP_KEY in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-5MB}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-uploads:
