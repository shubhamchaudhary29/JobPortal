services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env (use mongodb://mongodb:27017/jobportal for Compose)}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-Strict}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_MAX_ENTRIES: ${LOGIN_RATE_LIMIT_MAX_ENTRIES:-10000}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:?Set ADZUNA_APP_ID in .env}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:?Set ADZUNA_APP_KEY in .env}
      ADZUNA_CONNECT_TIMEOUT_MS: ${ADZUNA_CONNECT_TIMEOUT_MS:-3000}
      ADZUNA_READ_TIMEOUT_MS: ${ADZUNA_READ_TIMEOUT_MS:-5000}
      ADZUNA_RETRY_MAX_ATTEMPTS: ${ADZUNA_RETRY_MAX_ATTEMPTS:-3}
      ADZUNA_RETRY_INITIAL_BACKOFF_MS: ${ADZUNA_RETRY_INITIAL_BACKOFF_MS:-200}
      ADZUNA_CIRCUIT_FAILURE_THRESHOLD: ${ADZUNA_CIRCUIT_FAILURE_THRESHOLD:-3}
      ADZUNA_CIRCUIT_OPEN_MS: ${ADZUNA_CIRCUIT_OPEN_MS:-60000}
      ADZUNA_PAGES_PER_KEYWORD: ${ADZUNA_PAGES_PER_KEYWORD:-2}
      ADZUNA_RESULTS_PER_PAGE: ${ADZUNA_RESULTS_PER_PAGE:-20}
      ADZUNA_KEYWORDS: ${ADZUNA_KEYWORDS:-java developer,python developer,react developer}
      MONGO_INDEX_VERIFY_ON_STARTUP: ${MONGO_INDEX_VERIFY_ON_STARTUP:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-6MB}
      RESUME_MAX_BYTES: ${RESUME_MAX_BYTES:-5242880}
      CANDIDATE_RESUME_MAX_BYTES: ${CANDIDATE_RESUME_MAX_BYTES:-5242880}
      CANDIDATE_RESUME_ALLOWED_FORMATS: ${CANDIDATE_RESUME_ALLOWED_FORMATS:-pdf,docx}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      JOB_AGGREGATION_SCHEDULING_ENABLED: ${JOB_AGGREGATION_SCHEDULING_ENABLED:-true}
      GREENHOUSE_SYNC_DELAY_MS: ${GREENHOUSE_SYNC_DELAY_MS:-21600000}
      LEVER_SYNC_DELAY_MS: ${LEVER_SYNC_DELAY_MS:-21600000}
      ADZUNA_SCHEDULE_DELAY_MS: ${ADZUNA_SCHEDULE_DELAY_MS:-43200000}
      JOB_AGGREGATION_LOCK_LEASE_MS: ${JOB_AGGREGATION_LOCK_LEASE_MS:-300000}
      JOB_AGGREGATION_LOCK_RENEWAL_MS: ${JOB_AGGREGATION_LOCK_RENEWAL_MS:-60000}
      JOB_AGGREGATION_SYNC_HISTORY_RETENTION_DAYS: ${JOB_AGGREGATION_SYNC_HISTORY_RETENTION_DAYS:-30}
      JOB_AGGREGATION_PROVIDER_CONNECT_TIMEOUT_MS: ${JOB_AGGREGATION_PROVIDER_CONNECT_TIMEOUT_MS:-3000}
      JOB_AGGREGATION_PROVIDER_READ_TIMEOUT_MS: ${JOB_AGGREGATION_PROVIDER_READ_TIMEOUT_MS:-5000}
      JOB_AGGREGATION_PROVIDER_RETRY_MAX_ATTEMPTS: ${JOB_AGGREGATION_PROVIDER_RETRY_MAX_ATTEMPTS:-3}
      JOB_AGGREGATION_PROVIDER_RETRY_INITIAL_BACKOFF_MS: ${JOB_AGGREGATION_PROVIDER_RETRY_INITIAL_BACKOFF_MS:-200}
      JOB_AGGREGATION_PROVIDER_RETRY_MAX_BACKOFF_MS: ${JOB_AGGREGATION_PROVIDER_RETRY_MAX_BACKOFF_MS:-5000}
      JOB_AGGREGATION_PROVIDER_MAX_RESPONSE_BYTES: ${JOB_AGGREGATION_PROVIDER_MAX_RESPONSE_BYTES:-2097152}
      JOB_AGGREGATION_PROVIDER_MAX_ITEMS: ${JOB_AGGREGATION_PROVIDER_MAX_ITEMS:-2000}
      JOB_AGGREGATION_PROVIDER_REQUESTS_PER_SECOND: ${JOB_AGGREGATION_PROVIDER_REQUESTS_PER_SECOND:-5}
      JOB_AGGREGATION_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: ${JOB_AGGREGATION_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-3}
      JOB_AGGREGATION_PROVIDER_CIRCUIT_OPEN_MS: ${JOB_AGGREGATION_PROVIDER_CIRCUIT_OPEN_MS:-60000}
      GREENHOUSE_BASE_URL: ${GREENHOUSE_BASE_URL:-https://boards-api.greenhouse.io/v1/boards}
      LEVER_BASE_URL: ${LEVER_BASE_URL:-https://api.lever.co/v0/postings}
      JOB_AGGREGATION_MISSING_THRESHOLD: ${JOB_AGGREGATION_MISSING_THRESHOLD:-3}
      JOB_AGGREGATION_RETENTION_DAYS: ${JOB_AGGREGATION_RETENTION_DAYS:-90}
      JOB_AGGREGATION_CLEANUP_BATCH_SIZE: ${JOB_AGGREGATION_CLEANUP_BATCH_SIZE:-100}
      JOB_AGGREGATION_CLEANUP_LOCK_LEASE_MS: ${JOB_AGGREGATION_CLEANUP_LOCK_LEASE_MS:-300000}
      JOB_AGGREGATION_CLEANUP_CRON: ${JOB_AGGREGATION_CLEANUP_CRON:-0 30 2 * * *}
      MATCHING_SKILLS_WEIGHT: ${MATCHING_SKILLS_WEIGHT:-40}
      MATCHING_EXPERIENCE_WEIGHT: ${MATCHING_EXPERIENCE_WEIGHT:-20}
      MATCHING_TITLE_WEIGHT: ${MATCHING_TITLE_WEIGHT:-15}
      MATCHING_EDUCATION_WEIGHT: ${MATCHING_EDUCATION_WEIGHT:-10}
      MATCHING_LOCATION_WEIGHT: ${MATCHING_LOCATION_WEIGHT:-10}
      MATCHING_EMPLOYMENT_TYPE_WEIGHT: ${MATCHING_EMPLOYMENT_TYPE_WEIGHT:-5}
      MATCHING_CANDIDATE_WINDOW: ${MATCHING_CANDIDATE_WINDOW:-500}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:
  backend-uploads:
