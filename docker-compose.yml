services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env (use mongodb://mongodb:27017/jobportal for Compose)}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-Strict}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_MAX_ENTRIES: ${LOGIN_RATE_LIMIT_MAX_ENTRIES:-10000}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:?Set ADZUNA_APP_ID in .env}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:?Set ADZUNA_APP_KEY in .env}
      ADZUNA_CONNECT_TIMEOUT_MS: ${ADZUNA_CONNECT_TIMEOUT_MS:-3000}
      ADZUNA_READ_TIMEOUT_MS: ${ADZUNA_READ_TIMEOUT_MS:-5000}
      ADZUNA_RETRY_MAX_ATTEMPTS: ${ADZUNA_RETRY_MAX_ATTEMPTS:-3}
      ADZUNA_RETRY_INITIAL_BACKOFF_MS: ${ADZUNA_RETRY_INITIAL_BACKOFF_MS:-200}
      ADZUNA_CIRCUIT_FAILURE_THRESHOLD: ${ADZUNA_CIRCUIT_FAILURE_THRESHOLD:-3}
      ADZUNA_CIRCUIT_OPEN_MS: ${ADZUNA_CIRCUIT_OPEN_MS:-60000}
      ADZUNA_SCHEDULE_CRON: ${ADZUNA_SCHEDULE_CRON:-0 0 */6 * * *}
      ADZUNA_PAGES_PER_KEYWORD: ${ADZUNA_PAGES_PER_KEYWORD:-2}
      ADZUNA_RESULTS_PER_PAGE: ${ADZUNA_RESULTS_PER_PAGE:-20}
      ADZUNA_KEYWORDS: ${ADZUNA_KEYWORDS:-java developer,python developer,react developer}
      MONGO_INDEX_VERIFY_ON_STARTUP: ${MONGO_INDEX_VERIFY_ON_STARTUP:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-5MB}
      RESUME_MAX_BYTES: ${RESUME_MAX_BYTES:-5242880}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      APP_SCHEDULING_ENABLED: ${APP_SCHEDULING_ENABLED:-true}
      JOB_AGGREGATION_SCHEDULING_ENABLED: ${JOB_AGGREGATION_SCHEDULING_ENABLED:-true}
      GREENHOUSE_SYNC_DELAY_MS: ${GREENHOUSE_SYNC_DELAY_MS:-21600000}
      LEVER_SYNC_DELAY_MS: ${LEVER_SYNC_DELAY_MS:-21600000}
      ADZUNA_SCHEDULE_DELAY_MS: ${ADZUNA_SCHEDULE_DELAY_MS:-43200000}
      JOB_AGGREGATION_LOCK_LEASE_MS: ${JOB_AGGREGATION_LOCK_LEASE_MS:-300000}
      JOB_AGGREGATION_LOCK_RENEWAL_MS: ${JOB_AGGREGATION_LOCK_RENEWAL_MS:-60000}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-uploads:
