name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/jobportal
      JWT_SECRET: test-only-jwt-secret-that-is-at-least-thirty-two-characters
      ADZUNA_APP_ID: test-id
      ADZUNA_APP_KEY: test-key
    defaults:
      run:
        working-directory: backend/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Mock-provider reliability tests
        run: ./mvnw -Dtest='*Reliability*,*Payload*,*SanitizedLog*' test
      - name: Clean backend verification with real MongoDB
        run: ./mvnw clean verify
      - name: Registry classifier fixtures
        run: bash scripts/verify-employer-registry-classification.sh
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev
  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      MONGODB_URI: mongodb://mongodb:27017/jobportal
      JWT_SECRET: test-only-jwt-secret-that-is-at-least-thirty-two-characters
      ADZUNA_APP_ID: test-id
      ADZUNA_APP_KEY: test-key
      CORS_ALLOWED_ORIGINS: http://localhost
      REFRESH_COOKIE_SECURE: 'false'
      JOB_AGGREGATION_SCHEDULING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build Compose images
        run: docker compose build
      - name: Deterministic Compose smoke test
        run: bash backend/backend/scripts/compose-smoke-test.sh
      - name: Whitespace verification
        run: git diff --check
