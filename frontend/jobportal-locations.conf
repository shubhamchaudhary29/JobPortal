# Locations shared by the HTTPS (nginx.conf.template) and HTTP (nginx-http.conf) servers. Included in server context.

include /etc/nginx/jobportal/security-headers.conf;

# gzip is switched on only in the static locations below: server-wide it would also compress proxied
# /api/ responses (gzip_proxied concerns requests that arrive via a proxy, not proxy_pass responses).
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml application/x-protobuf;

# limit_req rejections get a JSON body in the backend's ProblemDetail shape (GlobalExceptionHandler).
# Backend-generated 429s (login limiter) pass through unchanged: proxy_intercept_errors is off.
error_page 429 = @too_many;

location @too_many {
    include /etc/nginx/jobportal/security-headers.conf;
    add_header Retry-After "1" always;
    default_type application/problem+json;
    return 429 '{"type":"https://jobportal.example/problems/rate-limit","title":"Too many requests","status":429,"detail":"Too many requests, slow down and try again shortly.","code":"RATE_LIMITED"}';
}

# No rate limits on tiles (MapLibre fires many range requests per pan), static assets or /ws.
location = /tiles/manifest.json {
    root /usr/share/nginx;
    try_files $uri =404;
    include /etc/nginx/jobportal/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location /tiles/ {
    root /usr/share/nginx;
    try_files $uri =404;          # never fall through to the SPA's index.html
    access_log off;
    types {
        application/octet-stream pmtiles;
        application/x-protobuf  pbf;
        application/json        json;
        image/png               png;
    }
    include /etc/nginx/jobportal/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    gzip on;                      # fonts/JSON only: .pmtiles is octet-stream, so byte ranges stay intact
}

location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    gzip on;
}

# General API zone. /api/v1/jobs/map/snapshot stays here: it is precomputed and answered with ETag/304.
location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/jobportal/proxy-backend.conf;
}

# Map job lists hit MongoDB on a cache miss, so they get a tighter per-IP rate.
location ~ ^/api/v1/jobs/map/(nearby|places/[^/]+/jobs|offices/[^/]+/jobs|unplaced)$ {
    limit_req zone=map_list burst=10 nodelay;
    include /etc/nginx/jobportal/proxy-backend.conf;
}

# Login, refresh and both registrations (AuthController). Logout (DELETE /sessions/current) stays in the api zone.
location ~ ^/api/v1/auth/(sessions|sessions/refresh|registrations|recruiter-registrations)$ {
    limit_req zone=auth burst=5 nodelay;
    include /etc/nginx/jobportal/proxy-backend.conf;
}

# Only answers when SWAGGER_ENABLED=true; otherwise the backend returns 404.
location ~ ^/(swagger-ui|v3/api-docs) {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/jobportal/proxy-backend.conf;
}

location /ws {
    proxy_pass http://backend:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}
