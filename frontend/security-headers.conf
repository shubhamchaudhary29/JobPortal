# Security headers (GEO-7B). Included at server level AND in every location that has its own add_header,
# because one add_header in a location drops all inherited server-level add_header directives.
add_header Strict-Transport-Security $jobportal_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Report-only for now: MapLibre runs blob workers and a wrong enforcing policy breaks the map silently.
# Promote to Content-Security-Policy once the browser console shows no violations (later phase).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
