# Proxy settings shared by every /api/ location (GEO-7B). Included inside a location block.
proxy_pass http://jobportal_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The backend trusts only X-Real-IP (shared.web.ClientIp); never forward the client's X-Forwarded-For chain.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# nginx sets these for every response (security-headers.conf); drop Spring Security's copies to avoid duplicates.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
client_max_body_size 10M;
