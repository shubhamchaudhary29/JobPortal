# GEO-7B request rate limits (http context; installed as /etc/nginx/conf.d/00-limits.conf so it loads before
# default.conf). Keys are $binary_remote_addr: the real visitor, also behind Cloudflare once realip.conf has run.
# The backend's own login limiter stays; these are defence in depth.
limit_req_zone $binary_remote_addr zone=api:10m      rate=20r/s;
limit_req_zone $binary_remote_addr zone=map_list:10m rate=5r/s;
# auth (login, registrations) and refresh are coarse per-IP flood guards only: a college lab or a mobile CGNAT pool can
# share one IP. Per-account limits live in the backend (login: IP + email; refresh: per session). GEO-7F.
limit_req_zone $binary_remote_addr zone=auth:10m     rate=30r/m;
limit_req_zone $binary_remote_addr zone=refresh:10m  rate=120r/m;
limit_req_status 429;
limit_req_log_level warn;

# HSTS only on HTTPS responses (an empty value sends no header), so one security-headers.conf serves both configs.
map $scheme $jobportal_hsts {
    https   "max-age=31536000";
    default "";
}
