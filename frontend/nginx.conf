server {

    listen 80;

    server_name 54-236-126-94.sslip.io;

    return 301 https://$host$request_uri;

}


server {

    listen 443 ssl;

    server_name 54-236-126-94.sslip.io;


    ssl_certificate 
    /etc/letsencrypt/live/54-236-126-94.sslip.io/fullchain.pem;


    ssl_certificate_key 
    /etc/letsencrypt/live/54-236-126-94.sslip.io/privkey.pem;



    location / {

        root /usr/share/nginx/html;

        index index.html;

        try_files $uri /index.html;

    }

}
    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File upload support
        client_max_body_size 10M;
    }

    # Proxy non-API backend endpoints (applications, auth, jobs, etc.)
    # These go directly to backend without /api prefix
    location ~ ^/(applications|auth|users|jobs|chat|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File upload support
        client_max_body_size 10M;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
