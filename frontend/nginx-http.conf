upstream jobportal_backend {
    server backend:8080;
    keepalive 64;
    # Shorter than Tomcat's keep-alive idle timeout, so nginx never reuses a socket Tomcat already closed.
    keepalive_timeout 15s;
}

server {
    listen 80;
    server_name _;

    # gzip is switched on only in the static locations below: server-wide it would also compress proxied
    # /api/ responses (gzip_proxied concerns requests that arrive via a proxy, not proxy_pass responses).
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/x-protobuf;

    location = /tiles/manifest.json {
        root /usr/share/nginx;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location /tiles/ {
        root /usr/share/nginx;
        try_files $uri =404;          # never fall through to the SPA's index.html
        access_log off;
        types {
            application/octet-stream pmtiles;
            application/x-protobuf  pbf;
            application/json        json;
            image/png               png;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip on;                      # fonts/JSON only: .pmtiles is octet-stream, so byte ranges stay intact
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        gzip on;
    }

    location /api/ {
        proxy_pass http://jobportal_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://jobportal_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
