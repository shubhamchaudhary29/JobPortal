spring.application.name=backend

# MongoDB
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:jobportal}
spring.data.mongodb.auto-index-creation=true

# File uploads
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}

# Adzuna API
adzuna.app.id=${ADZUNA_APP_ID:4cf3db0b}
adzuna.app.key=${ADZUNA_APP_KEY:2d7ba727c4dfcfa80c3bfd4ce8bf26ff}

app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:5173}
