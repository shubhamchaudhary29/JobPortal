spring.application.name=backend

# MONGODB_URI must include the database name.
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:6MB}
app.upload-dir=${UPLOAD_DIR:uploads}
app.resume.max-bytes=${RESUME_MAX_BYTES:5242880}
app.candidate-resume.max-bytes=${CANDIDATE_RESUME_MAX_BYTES:5242880}
app.candidate-resume.allowed-formats=${CANDIDATE_RESUME_ALLOWED_FORMATS:pdf,docx}

jwt.secret=${JWT_SECRET}
security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
security.refresh-token-days=${REFRESH_TOKEN_DAYS:14}
security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
security.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Strict}
security.login-rate-limit.attempts=${LOGIN_RATE_LIMIT_ATTEMPTS:5}
security.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
security.login-rate-limit.max-entries=${LOGIN_RATE_LIMIT_MAX_ENTRIES:10000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# Expose only bounded operational endpoints; SecurityConfig restricts all of them to ADMIN.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.info.env.enabled=false

adzuna.app.id=${ADZUNA_APP_ID}
adzuna.app.key=${ADZUNA_APP_KEY}
adzuna.connect-timeout-ms=${ADZUNA_CONNECT_TIMEOUT_MS:3000}
adzuna.read-timeout-ms=${ADZUNA_READ_TIMEOUT_MS:5000}
adzuna.retry.max-attempts=${ADZUNA_RETRY_MAX_ATTEMPTS:3}
adzuna.retry.initial-backoff-ms=${ADZUNA_RETRY_INITIAL_BACKOFF_MS:200}
adzuna.circuit.failure-threshold=${ADZUNA_CIRCUIT_FAILURE_THRESHOLD:3}
adzuna.circuit.open-ms=${ADZUNA_CIRCUIT_OPEN_MS:60000}
adzuna.pages-per-keyword=${ADZUNA_PAGES_PER_KEYWORD:2}
adzuna.results-per-page=${ADZUNA_RESULTS_PER_PAGE:20}
adzuna.keywords=${ADZUNA_KEYWORDS:java developer,python developer,react developer,data analyst,backend engineer,frontend developer,full stack developer,machine learning engineer}
app.mongo.indexes.verify-on-startup=${MONGO_INDEX_VERIFY_ON_STARTUP:true}

# Prevent HTTP client debug logs from emitting credential-bearing query strings.
logging.level.org.springframework.web.client.RestTemplate=INFO
job-aggregation.scheduling.enabled=${JOB_AGGREGATION_SCHEDULING_ENABLED:true}
job-aggregation.scheduling.greenhouse-delay-ms=${GREENHOUSE_SYNC_DELAY_MS:21600000}
job-aggregation.scheduling.lever-delay-ms=${LEVER_SYNC_DELAY_MS:21600000}
job-aggregation.lock-lease-ms=${JOB_AGGREGATION_LOCK_LEASE_MS:300000}
job-aggregation.lock-renewal-ms=${JOB_AGGREGATION_LOCK_RENEWAL_MS:60000}
job-aggregation.sync-history.retention-days=${JOB_AGGREGATION_SYNC_HISTORY_RETENTION_DAYS:30}
job-aggregation.providers.connect-timeout-ms=${JOB_AGGREGATION_PROVIDER_CONNECT_TIMEOUT_MS:3000}
job-aggregation.providers.read-timeout-ms=${JOB_AGGREGATION_PROVIDER_READ_TIMEOUT_MS:5000}
job-aggregation.providers.retry.max-attempts=${JOB_AGGREGATION_PROVIDER_RETRY_MAX_ATTEMPTS:3}
job-aggregation.providers.retry.initial-backoff-ms=${JOB_AGGREGATION_PROVIDER_RETRY_INITIAL_BACKOFF_MS:200}
job-aggregation.providers.retry.max-backoff-ms=${JOB_AGGREGATION_PROVIDER_RETRY_MAX_BACKOFF_MS:5000}
job-aggregation.providers.max-response-bytes=${JOB_AGGREGATION_PROVIDER_MAX_RESPONSE_BYTES:2097152}
job-aggregation.providers.max-items=${JOB_AGGREGATION_PROVIDER_MAX_ITEMS:2000}
job-aggregation.providers.requests-per-second=${JOB_AGGREGATION_PROVIDER_REQUESTS_PER_SECOND:5}
job-aggregation.providers.circuit.failure-threshold=${JOB_AGGREGATION_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:3}
job-aggregation.providers.circuit.open-ms=${JOB_AGGREGATION_PROVIDER_CIRCUIT_OPEN_MS:60000}
job-aggregation.providers.greenhouse-base-url=${GREENHOUSE_BASE_URL:https://boards-api.greenhouse.io/v1/boards}
job-aggregation.providers.lever-base-url=${LEVER_BASE_URL:https://api.lever.co/v0/postings}
job-aggregation.lifecycle.missing-threshold=${JOB_AGGREGATION_MISSING_THRESHOLD:3}
job-aggregation.cleanup.retention-days=${JOB_AGGREGATION_RETENTION_DAYS:90}
job-aggregation.cleanup.batch-size=${JOB_AGGREGATION_CLEANUP_BATCH_SIZE:100}
job-aggregation.cleanup.lock-lease-ms=${JOB_AGGREGATION_CLEANUP_LOCK_LEASE_MS:300000}
job-aggregation.cleanup.cron=${JOB_AGGREGATION_CLEANUP_CRON:0 30 2 * * *}
adzuna.schedule-delay-ms=${ADZUNA_SCHEDULE_DELAY_MS:43200000}
# Deterministic profile-to-job matching. The six weights must total 100.
matching.skills-weight=${MATCHING_SKILLS_WEIGHT:40}
matching.experience-weight=${MATCHING_EXPERIENCE_WEIGHT:20}
matching.title-weight=${MATCHING_TITLE_WEIGHT:15}
matching.education-weight=${MATCHING_EDUCATION_WEIGHT:10}
matching.location-weight=${MATCHING_LOCATION_WEIGHT:10}
matching.employment-type-weight=${MATCHING_EMPLOYMENT_TYPE_WEIGHT:5}
# Application-side ranking is intentionally bounded; invariant job features are persisted and versioned.
matching.candidate-window=${MATCHING_CANDIDATE_WINDOW:500}
# Public registration creates only USER/RECRUITER roles. Provision ADMIN through a controlled database migration.

