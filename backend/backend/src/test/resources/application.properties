spring.data.mongodb.uri=mongodb://localhost:27017/jobportal-test
jwt.secret=test-only-secret-material-at-least-thirty-two-bytes
adzuna.app.id=test-only-placeholder
adzuna.app.key=test-only-placeholder
app.cors.allowed-origins=http://localhost
spring.task.scheduling.enabled=false
logging.level.org.springframework.web.client.RestTemplate=INFO
job-aggregation.scheduling.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.info.env.enabled=false
app.upload-dir=${java.io.tmpdir}/jobportal-test-uploads
app.candidate-resume.max-bytes=5242880
app.candidate-resume.allowed-formats=pdf,docx
spring.jackson.deserialization.fail-on-unknown-properties=true
